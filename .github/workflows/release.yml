name: Release

# Push a tag such as v0.2.0 to build the download and open a draft release.
# "Run workflow" builds the same file as an artifact without releasing.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (windows-x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: AxeTwoDriver
      # The DAW library is a separate GPLv3 project; the download ships it
      # alongside. package.ps1 records both commits in SOURCE.txt.
      - uses: actions/checkout@v7
        with:
          repository: RamonWide/AxeTwoDriver-DAW
          path: AxeTwoDriver-DAW

      - name: Check the version
        shell: bash
        working-directory: AxeTwoDriver
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          if [ -z "$version" ]; then echo "no version in Cargo.toml" >&2; exit 1; fi
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable

      - name: Build and package
        shell: pwsh
        run: ./AxeTwoDriver/scripts/package.ps1

      - uses: actions/upload-artifact@v7
        with:
          name: AxeTwoDriver-windows-x64
          path: AxeTwoDriver/dist/*.zip
          if-no-files-found: error

  release:
    name: Draft release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum AxeTwoDriver-* > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/AxeTwoDriver-*
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft --generate-notes \
            --title "AxeTwoDriver ${GITHUB_REF_NAME#v}"
