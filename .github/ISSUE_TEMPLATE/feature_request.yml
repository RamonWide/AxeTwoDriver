name: Feature request
description: Something AxeTwoDriver should be able to do.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Please check [ROADMAP.md](https://github.com/RamonWide/AxeTwoDriver/blob/main/ROADMAP.md) first:
        if the feature is already listed, add a thumbs-up to its issue or tell us why it matters to you.
  - type: textarea
    id: need
    attributes:
      label: What do you want to do?
      description: Describe the task, not only the setting. "When I record I want to..."
    validations:
      required: true
  - type: textarea
    id: original
    attributes:
      label: Did the original driver do this?
      description: If so, say how it looked or behaved there.
  - type: checkboxes
    id: blocker
    attributes:
      label: How much does it matter?
      options:
        - label: This is what stops me from using AxeTwoDriver
